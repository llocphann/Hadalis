name: Feature Request
description: Suggest a Hadalis feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem are you trying to solve
      placeholder: I cannot configure a module differently for a specific perimeter placement
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you want without assuming a specific implementation
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which Hadalis area is primarily affected
      options:
        - Perimeter / module placement
        - Top or bottom surface
        - Left or right sidebar
        - Dock
        - Settings / configuration
        - Notifications
        - Media / weather / status module
        - System or hardware integration
        - Install / update / packaging
        - Developer tooling / documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or existing configuration you considered

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I can submit a pull request against `dev`
        - label: I can help test this feature

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references, hardware/service constraints, or other relevant details
