name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fish jq rsync

      - name: Validate syntax and generated state
        run: |
          bash -n setup
          bash -n sdata/lib/functions.sh
          bash -n sdata/lib/robust-update.sh
          bash -n sdata/lib/snapshots.sh
          bash -n scripts/test-update-lifecycle.sh
          bash -n scripts/test-local-distribution.sh
          bash -n scripts/test-battery-charge-limit-helper.sh
          bash -n scripts/test-thinkfan-helper.sh
          bash -n scripts/test-tlp-settings-ui-guards.sh
          bash -n scripts/test-tlp-integration-lifecycle.sh
          bash -n scripts/verify-docs.sh
          sh -n assets/helpers/inir-thinkfan
          bash -n distro/arch/inir-shell/PKGBUILD
          bash -n distro/arch/inir-shell-git/PKGBUILD
          bash -n distro/arch/inir-meta/PKGBUILD
          bash -n translations/tools/manage-translations.sh
          node --check translations/tools/auto-translate.js
          python3 -m json.tool sdata/runtime-exclusions.json >/dev/null
          for locale in translations/*.json; do python3 -m json.tool "$locale" >/dev/null; done
          python3 -m json.tool translations/l10n/glossary.json >/dev/null
          python3 -m json.tool translations/l10n/locale-guides.json >/dev/null
          python3 -m py_compile \
            sdata/lib/runtime-payload.py \
            scripts/lib/generate-ipc-registry.py \
            translations/tools/l10n.py \
            translations/tools/source-parity.py \
            translations/tools/translation-manager.py \
            translations/tools/translation-cleaner.py
          python3 translations/tools/l10n.py audit-all
          python3 translations/tools/source-parity.py
          python3 scripts/lib/generate-ipc-registry.py --check
          make -n install PREFIX=/tmp/inir-stage-test >/dev/null

      - name: Validate package source identity
        run: |
          for pkg in distro/arch/inir-shell/PKGBUILD distro/arch/inir-shell-git/PKGBUILD distro/arch/inir-meta/PKGBUILD; do
            grep -Fq "url='https://github.com/llocphann/Hadalis'" "$pkg"
            if grep -Fqi 'github.com/snowarch/inir' "$pkg"; then
              echo "$pkg still sources the upstream iNiR repository" >&2
              exit 1
            fi
          done
          grep -Fq 'github.com/llocphann/Hadalis/archive/${_source_ref}.tar.gz' distro/arch/inir-shell/PKGBUILD
          grep -Fq 'git+https://github.com/llocphann/Hadalis.git#branch=dev' distro/arch/inir-shell-git/PKGBUILD

          for info in distro/arch/inir-shell/.SRCINFO distro/arch/inir-shell-git/.SRCINFO distro/arch/inir-meta/.SRCINFO; do
            grep -Fq 'url = https://github.com/llocphann/Hadalis' "$info"
            if grep -Fqi 'github.com/snowarch/inir' "$info"; then
              echo "$info still advertises the upstream iNiR repository" >&2
              exit 1
            fi
          done

          for pkg in inir-shell inir-meta; do
            pkgbuild="distro/arch/$pkg/PKGBUILD"
            srcinfo="distro/arch/$pkg/.SRCINFO"
            pkgver="$(grep -m1 '^pkgver=' "$pkgbuild" | cut -d= -f2)"
            pkgrel="$(grep -m1 '^pkgrel=' "$pkgbuild" | cut -d= -f2)"
            grep -Fq "pkgver = $pkgver" "$srcinfo"
            grep -Fq "pkgrel = $pkgrel" "$srcinfo"
          done
          grep -Fq 'license = GPL-3.0-only' distro/arch/inir-shell-git/.SRCINFO
          grep -Fq 'source = inir::git+https://github.com/llocphann/Hadalis.git#branch=dev' distro/arch/inir-shell-git/.SRCINFO
          grep -Fq 'optdepends = thinkfan: managed fan-control integration' distro/arch/inir-shell/.SRCINFO
          grep -Fq 'optdepends = thinkfan: managed fan-control integration' distro/arch/inir-shell-git/.SRCINFO

      - name: Validate privileged integration packaging
        run: |
          grep -Fq 'org.freedesktop.policykit.exec.path">/usr/libexec/inir-thinkfan' assets/polkit/org.inir.thinkfan.policy
          for pkg in distro/arch/inir-shell/PKGBUILD distro/arch/inir-shell-git/PKGBUILD; do
            grep -Fq 'assets/applications/inir-settings.desktop' "$pkg"
            grep -Fq '$pkgdir/usr/share/applications/inir-settings.desktop' "$pkg"
            grep -Fq 'distro/arch/inir-shell/inir-quickshell-rebuild.hook' "$pkg"
            grep -Fq '$pkgdir/usr/share/libalpm/hooks/inir-quickshell-rebuild.hook' "$pkg"
            grep -Fq 'assets/helpers/inir-battery-charge-limit' "$pkg"
            grep -Fq '$pkgdir/usr/libexec/inir-battery-charge-limit' "$pkg"
            grep -Fq 'assets/polkit/org.inir.battery-charge-limit.policy' "$pkg"
            grep -Fq 'assets/tlp/tlp-settings-schema.json' "$pkg"
            grep -Fq 'assets/helpers/inir-thinkfan' "$pkg"
            grep -Fq '$pkgdir/usr/libexec/inir-thinkfan' "$pkg"
            grep -Fq 'assets/polkit/org.inir.thinkfan.policy' "$pkg"
          done

      - name: Validate ThinkFan process timeout guards
        run: |
          service=services/ThinkFanService.qml
          grep -Fq 'detectorTimeout.restart()' "$service"
          grep -Fq 'root._clearStatus("status-timeout")' "$service"
          grep -Fq 'id: detectorTimeout' "$service"
          grep -Fq 'interval: 5000' "$service"
          grep -Fq 'detector.timedOut = true' "$service"
          grep -Fq 'detector.running = false' "$service"
          grep -Fq 'applyTimeout.restart()' "$service"
          grep -Fq 'root.lastApplySucceeded = exitCode === 0 && !applyProcess.timedOut' "$service"
          grep -Fq '? "apply-timeout"' "$service"
          grep -Fq 'id: applyTimeout' "$service"
          grep -Fq 'interval: 60000' "$service"
          grep -Fq 'applyProcess.timedOut = true' "$service"
          grep -Fq 'applyProcess.running = false' "$service"

      - name: Validate distribution install contracts
        run: |
          grep -qx 'Type=dbus' assets/systemd/inir.service
          grep -qx 'BusName=org.kde.StatusNotifierWatcher' assets/systemd/inir.service
          grep -qx 'After=graphical-session-pre.target' assets/systemd/inir.service
          grep -qx 'Before=graphical-session.target' assets/systemd/inir.service
          if grep -qx 'After=graphical-session.target' assets/systemd/inir.service; then
            echo 'canonical user service starts too late for tray ownership' >&2
            exit 1
          fi

          for module in nix/nixos-module.nix nix/home-module.nix; do
            grep -Fq 'Type = "dbus";' "$module"
            grep -Fq 'BusName = "org.kde.StatusNotifierWatcher";' "$module"
            grep -Fq '"graphical-session-pre.target"' "$module"
            grep -Fq '"graphical-session.target"' "$module"
            if grep -Fq 'Requisite' "$module"; then
              echo "$module still requires graphical-session.target before startup" >&2
              exit 1
            fi
          done

          install_plan="$(make -n install PREFIX=/usr DESTDIR=/tmp/inir-stage-test)"
          for staged_path in \
            /tmp/inir-stage-test/usr/bin/inir \
            /tmp/inir-stage-test/usr/share/quickshell/inir \
            /tmp/inir-stage-test/usr/lib/systemd/user/inir.service \
            /tmp/inir-stage-test/usr/share/applications/inir.desktop \
            /tmp/inir-stage-test/usr/share/doc/inir-shell/README.md \
            /tmp/inir-stage-test/usr/libexec/inir-battery-charge-limit \
            /tmp/inir-stage-test/usr/libexec/inir-thinkfan; do
            grep -Fq "$staged_path" <<< "$install_plan"
          done

      - name: Run updater and TLP regressions
        run: |
          bash scripts/test-update-lifecycle.sh
          bash scripts/test-tlp-settings-ui-guards.sh
          bash scripts/test-tlp-integration-lifecycle.sh

      - name: Run QML startup guards
        run: fish scripts/qml-check.fish --all

      - name: Run aggregate static suite
        run: bash scripts/test-local-distribution.sh
