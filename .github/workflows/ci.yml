name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install local-validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fish jq rsync

      - name: Run canonical local validator
        run: bash scripts/validate-maintainer-local.sh --current-repo
