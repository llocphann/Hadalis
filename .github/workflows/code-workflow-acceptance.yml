name: Code Workflow acceptance

on:
  push:
    paths:
      - '.github/workflows/code-workflow-acceptance.yml'
      - 'flake.nix'
      - 'nix/**'
      - 'services/CodeWorkflow*.qml'
      - 'services/RuntimeDiagnostics*.qml'
      - 'shell.qml'
      - 'ShellIiPanels.qml'
      - 'ShellWafflePanels.qml'
      - 'modules/ii/ShellIiPanelsImpl.qml'
      - 'modules/ii/critical/ShellIiCriticalPanels.qml'
      - 'modules/waffle/ShellWafflePanelsImpl.qml'
      - 'modules/waffle/critical/ShellWaffleCriticalPanels.qml'
      - 'modules/settings/CodeWorkflow*.qml'
      - 'modules/settings/RuntimeDiagnostics*.qml'
      - 'waffleSettings.qml'
      - 'modules/waffle/settings/WSettingsContent.qml'
      - 'modules/waffle/settings/pages/WDiagnosticsPage.qml'
      - 'modules/common/widgets/PopupToolTip.qml'
      - 'modules/waffle/altSwitcher/WaffleAltSwitcherTile.qml'
      - 'modules/settings/SettingsPageHost.qml'
      - 'modules/settings/SettingsFocus.qml'
      - 'modules/settings/SettingsOverlay.qml'
      - 'modules/settings/SettingsPageRegistryData.qml'
      - 'settings.qml'
      - 'scripts/code-workflow/**'
      - 'scripts/runtime-diagnostics-sampler.py'
      - 'scripts/test-code-workflow-*.py'
      - 'scripts/test-runtime-diagnostics-*.py'
      - 'defaults/code-workflow-ir.json'
      - 'sdata/runtime-exclusions.json'
      - 'docs/CODE_WORKFLOW_*.md'
  pull_request:
    paths:
      - '.github/workflows/code-workflow-acceptance.yml'
      - 'flake.nix'
      - 'nix/**'
      - 'services/CodeWorkflow*.qml'
      - 'services/RuntimeDiagnostics*.qml'
      - 'shell.qml'
      - 'ShellIiPanels.qml'
      - 'ShellWafflePanels.qml'
      - 'modules/ii/ShellIiPanelsImpl.qml'
      - 'modules/ii/critical/ShellIiCriticalPanels.qml'
      - 'modules/waffle/ShellWafflePanelsImpl.qml'
      - 'modules/waffle/critical/ShellWaffleCriticalPanels.qml'
      - 'modules/settings/CodeWorkflow*.qml'
      - 'modules/settings/RuntimeDiagnostics*.qml'
      - 'waffleSettings.qml'
      - 'modules/waffle/settings/WSettingsContent.qml'
      - 'modules/waffle/settings/pages/WDiagnosticsPage.qml'
      - 'modules/common/widgets/PopupToolTip.qml'
      - 'modules/waffle/altSwitcher/WaffleAltSwitcherTile.qml'
      - 'modules/settings/SettingsPageHost.qml'
      - 'modules/settings/SettingsFocus.qml'
      - 'modules/settings/SettingsOverlay.qml'
      - 'modules/settings/SettingsPageRegistryData.qml'
      - 'settings.qml'
      - 'scripts/code-workflow/**'
      - 'scripts/runtime-diagnostics-sampler.py'
      - 'scripts/test-code-workflow-*.py'
      - 'scripts/test-runtime-diagnostics-*.py'
      - 'defaults/code-workflow-ir.json'
      - 'sdata/runtime-exclusions.json'
      - 'docs/CODE_WORKFLOW_*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-workflow-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Evaluate acceptance environment
        run: nix develop .#workflow-acceptance --command bash -lc 'command -v quickshell; command -v sway; test -f "$HADALIS_WORKFLOW_GRAMMAR"; test -f "$HADALIS_TREE_SITTER_LIBRARY"'

      # Unlike source-string contracts, Qt parses the actual QML/JavaScript
      # grammar here. Parse the complete Code Workflow surface so a newly added
      # singleton or editor component cannot bypass this boot-integrity gate.
      - name: Parse Code Workflow and shared interaction QML
        run: |
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            command -v qmlformat
            shopt -s nullglob
            qml_files=(
              modules/settings/CodeWorkflow*.qml
              modules/settings/RuntimeDiagnostics*.qml
              services/CodeWorkflow*.qml
              services/RuntimeDiagnostics*.qml
              modules/waffle/settings/pages/WDiagnosticsPage.qml
              modules/settings/SettingsPageHost.qml
              modules/common/widgets/PopupToolTip.qml
              modules/waffle/altSwitcher/WaffleAltSwitcherTile.qml
            )
            test "${#qml_files[@]}" -gt 0
            for qml in "${qml_files[@]}"; do
              echo "Parsing $qml"
              qmlformat --ignore-settings "$qml" >/dev/null
            done
          '

      - name: Validate modal hot-fix Source Editor
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-source-editor-contract.py'

      - name: Build isolated Wayland pointer for real editor clicks
        run: nix develop .#workflow-acceptance --command bash -lc 'bash scripts/code-workflow/build-pointer.sh "$RUNNER_TEMP/hadalis-workflow-pointer"'

      - name: Exercise live Settings Source Editor modal keys
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-workflow-editor
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            command -v wtype
            python3 scripts/code-workflow/run-editor-live.py \
              --work-dir "$WORK_DIR" \
              --revision "${GITHUB_SHA}" \
              --sway "$(command -v sway)" \
              --pointer "$RUNNER_TEMP/hadalis-workflow-pointer/pointer"
          '

      - name: Exercise Source Editor in nested Niri via real pointer and keyboard
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-wf-editor-niri
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            command -v niri
            python3 scripts/code-workflow/run-editor-headless-niri.py \
              --work-dir "$WORK_DIR" \
              --revision "${GITHUB_SHA}" \
              --sway "$(command -v sway)" \
              --pointer "$RUNNER_TEMP/hadalis-workflow-pointer/pointer"
          '

      - name: Exercise Source Editor in Settings Focus with real pointer
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-workflow-editor-focus
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/code-workflow/run-editor-live.py \
              --work-dir "$WORK_DIR" \
              --revision "${GITHUB_SHA}" \
              --surface focus \
              --sway "$(command -v sway)" \
              --pointer "$RUNNER_TEMP/hadalis-workflow-pointer/pointer"
          '

      - name: Exercise Source Editor in Settings Focus on nested Niri
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-wf-focus-niri
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/code-workflow/run-editor-headless-niri.py \
              --work-dir "$WORK_DIR" \
              --revision "${GITHUB_SHA}" \
              --surface focus \
              --sway "$(command -v sway)" \
              --pointer "$RUNNER_TEMP/hadalis-workflow-pointer/pointer"
          '

      - name: Exercise Source Editor with active Fcitx5 on nested Niri
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-wf-fcitx-niri
          HADALIS_WORKFLOW_FCITX: "1"
          QT_IM_MODULE: fcitx
          QT_DEBUG_PLUGINS: "1"
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/code-workflow/run-editor-headless-niri.py \
              --work-dir "$WORK_DIR" \
              --revision "${GITHUB_SHA}" \
              --sway "$(command -v sway)" \
              --pointer "$RUNNER_TEMP/hadalis-workflow-pointer/pointer"
          '

      - name: Validate Code Workflow production foundation
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-phase1-contract.py'

      - name: Validate canonical Workflow identity
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-identity-contract.py'

      - name: Validate cached runtime-boundary discovery
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-index-contract.py'

      - name: Validate Runtime Diagnostics session and sampler
        run: |
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/test-code-workflow-diagnostics-contract.py
            python3 scripts/test-runtime-diagnostics-session-contract.py
            python3 scripts/test-runtime-diagnostics-sampler.py
            python3 scripts/test-runtime-diagnostics-source-boundaries.py
          '

      - name: Validate semantic IR and unified edge provenance
        run: |
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/test-code-workflow-ir-contract.py
            python3 scripts/test-code-workflow-edge-selection.py
          '

      - name: Exercise atomic source editor CAS helper
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-editor-save.py'

      - name: Prove deterministic Connect preview coordinator
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-connect-preview-coordinator.py'

      - name: Prove Connect type compatibility oracle
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-connect-type.py'

      - name: Prove Connect cycle coverage boundary
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-connect-cycle.py'

      - name: Compose Connect research qualification
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-connect-qualify.py'

      - name: Validate Connect safety promotion boundary
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-connect-promotion.py'

      - name: Prepare qualified Connect artifacts
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-connect-preparation.py'

      - name: Integrate production Connect preparation
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-connect-production-preparation.py'

      - name: Prove isolated Connect commit and rollback engine
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-connect-commit.py'

      - name: Validate production internal Connect lifecycle
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-connect-production-lifecycle.py'

      - name: Validate explicit Connect authorization boundary
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-connect-authorization.py'

      - name: Validate user-facing Connect Apply boundary
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-connect-apply.py'

      - name: Prove isolated reviewed Disconnect transaction
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-disconnect-transaction.py'

      - name: Validate reviewed Disconnect production lifecycle
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-disconnect-production-lifecycle.py'

      - name: Prove isolated reviewed direct-binding replacement transaction
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-binding-transaction.py'

      - name: Validate reviewed Binding replacement production lifecycle
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-binding-production-lifecycle.py'

      - name: Audit cross-pipeline mutation serialization
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-mutation-serialization.py'

      - name: Validate cross-pipeline mutation contention harness
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-mutation-contention.py'

      - name: Prove reviewed signal-to-existing-action preview
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-signal-action-preview.py'

      - name: Prove isolated reviewed signal-action transaction
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-signal-action-transaction.py'

      - name: Validate reviewed Signal/Action internal production lifecycle
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-signal-action-production-lifecycle.py'

      - name: Validate user-facing Signal/Action Apply boundary
        run: nix develop .#workflow-acceptance --command bash -lc 'python3 scripts/test-code-workflow-signal-action-settings.py'

      - name: Run isolated Apply lifecycle acceptance
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-workflow-apply
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/code-workflow/run-apply-lifecycle.py               --work-dir "$WORK_DIR"               --revision "${GITHUB_SHA}"               --sway "$(command -v sway)"               --grammar "$HADALIS_WORKFLOW_GRAMMAR"
          '

      - name: Run isolated Connect lifecycle acceptance
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-workflow-connect
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/code-workflow/run-connect-lifecycle.py               --work-dir "$WORK_DIR"               --revision "${GITHUB_SHA}"               --sway "$(command -v sway)"               --grammar "$HADALIS_WORKFLOW_GRAMMAR"
          '

      - name: Integrate production internal Connect lifecycle
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-workflow-connect-production
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/code-workflow/run-connect-production-lifecycle.py               --work-dir "$WORK_DIR"               --revision "${GITHUB_SHA}"               --sway "$(command -v sway)"               --grammar "$HADALIS_WORKFLOW_GRAMMAR"
          '

      - name: Run isolated Connect authorization acceptance
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-workflow-connect-authorization
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/code-workflow/run-connect-authorization.py               --work-dir "$WORK_DIR"               --revision "${GITHUB_SHA}"               --sway "$(command -v sway)"               --grammar "$HADALIS_WORKFLOW_GRAMMAR"
          '

      - name: Run isolated user-facing Connect Apply acceptance
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-workflow-connect-user-apply
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/code-workflow/run-connect-user-apply.py               --work-dir "$WORK_DIR"               --revision "${GITHUB_SHA}"               --sway "$(command -v sway)"               --grammar "$HADALIS_WORKFLOW_GRAMMAR"
          '

      - name: Run isolated reviewed Disconnect production lifecycle
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-workflow-disconnect-production
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/code-workflow/run-disconnect-production-lifecycle.py               --work-dir "$WORK_DIR"               --revision "${GITHUB_SHA}"               --sway "$(command -v sway)"               --grammar "$HADALIS_WORKFLOW_GRAMMAR"
          '

      - name: Run isolated reviewed Binding replacement production lifecycle
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-workflow-binding-production
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/code-workflow/run-binding-production-lifecycle.py               --work-dir "$WORK_DIR"               --revision "${GITHUB_SHA}"               --sway "$(command -v sway)"               --grammar "$HADALIS_WORKFLOW_GRAMMAR"
          '

      - name: Run isolated reviewed Signal/Action production lifecycle
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-wf-sa-prod
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/code-workflow/run-signal-action-production-lifecycle.py               --work-dir "$WORK_DIR"               --revision "${GITHUB_SHA}"               --sway "$(command -v sway)"               --grammar "$HADALIS_WORKFLOW_GRAMMAR"
          '

      - name: Run isolated user-facing Signal/Action Apply acceptance
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-wf-sa-user
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/code-workflow/run-signal-action-user-apply.py               --work-dir "$WORK_DIR"               --revision "${GITHUB_SHA}"               --sway "$(command -v sway)"               --grammar "$HADALIS_WORKFLOW_GRAMMAR"
          '

      - name: Run cross-pipeline mutation contention acceptance
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-workflow-mutation-contention
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/code-workflow/run-mutation-contention.py               --work-dir "$WORK_DIR"               --revision "${GITHUB_SHA}"               --sway "$(command -v sway)"               --grammar "$HADALIS_WORKFLOW_GRAMMAR"
          '

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-workflow-apply-lifecycle-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hadalis-workflow-editor/editor-live-report.json
            ${{ runner.temp }}/hadalis-workflow-editor/manifest.json
            ${{ runner.temp }}/hadalis-workflow-editor/*.log
            ${{ runner.temp }}/hadalis-wf-editor-niri/p/editor-live-report.json
            ${{ runner.temp }}/hadalis-wf-editor-niri/p/*.log
            ${{ runner.temp }}/hadalis-wf-editor-niri/*.log
            ${{ runner.temp }}/hadalis-workflow-editor-focus/editor-live-report.json
            ${{ runner.temp }}/hadalis-workflow-editor-focus/*.log
            ${{ runner.temp }}/hadalis-wf-focus-niri/p/editor-live-report.json
            ${{ runner.temp }}/hadalis-wf-focus-niri/p/*.log
            ${{ runner.temp }}/hadalis-wf-focus-niri/*.log
            ${{ runner.temp }}/hadalis-wf-fcitx-niri/p/editor-live-report.json
            ${{ runner.temp }}/hadalis-wf-fcitx-niri/p/*.log
            ${{ runner.temp }}/hadalis-wf-fcitx-niri/*.log
            ${{ runner.temp }}/hadalis-workflow-apply/apply-lifecycle-report.json
            ${{ runner.temp }}/hadalis-workflow-apply/manifest.json
            ${{ runner.temp }}/hadalis-workflow-apply/*.log
            ${{ runner.temp }}/hadalis-workflow-apply/xdg-state/**
            ${{ runner.temp }}/hadalis-workflow-connect/connect-lifecycle-report.json
            ${{ runner.temp }}/hadalis-workflow-connect/*.log
            ${{ runner.temp }}/hadalis-workflow-connect/xdg-state/**
            ${{ runner.temp }}/hadalis-workflow-connect-production/connect-production-lifecycle-report.json
            ${{ runner.temp }}/hadalis-workflow-connect-production/*.log
            ${{ runner.temp }}/hadalis-workflow-connect-production/xdg-state/**
            ${{ runner.temp }}/hadalis-workflow-connect-authorization/connect-authorization-report.json
            ${{ runner.temp }}/hadalis-workflow-connect-authorization/*.log
            ${{ runner.temp }}/hadalis-workflow-connect-authorization/xdg-state/**
            ${{ runner.temp }}/hadalis-workflow-connect-user-apply/connect-user-apply-report.json
            ${{ runner.temp }}/hadalis-workflow-connect-user-apply/*.log
            ${{ runner.temp }}/hadalis-workflow-connect-user-apply/xdg-state/**
            ${{ runner.temp }}/hadalis-workflow-disconnect-production/disconnect-production-lifecycle-report.json
            ${{ runner.temp }}/hadalis-workflow-disconnect-production/*.log
            ${{ runner.temp }}/hadalis-workflow-disconnect-production/xdg-state/**
            ${{ runner.temp }}/hadalis-workflow-binding-production/binding-production-lifecycle-report.json
            ${{ runner.temp }}/hadalis-workflow-binding-production/*.log
            ${{ runner.temp }}/hadalis-workflow-binding-production/xdg-state/**
            ${{ runner.temp }}/hadalis-wf-sa-prod/signal-action-production-lifecycle-report.json
            ${{ runner.temp }}/hadalis-wf-sa-prod/*.log
            ${{ runner.temp }}/hadalis-wf-sa-prod/xdg-state/**
            ${{ runner.temp }}/hadalis-wf-sa-user/signal-action-user-apply-report.json
            ${{ runner.temp }}/hadalis-wf-sa-user/*.log
            ${{ runner.temp }}/hadalis-wf-sa-user/xdg-state/**
            ${{ runner.temp }}/hadalis-workflow-mutation-contention/mutation-contention-report.json
            ${{ runner.temp }}/hadalis-workflow-mutation-contention/*.log
            ${{ runner.temp }}/hadalis-workflow-mutation-contention/xdg-state/**
          if-no-files-found: warn
          retention-days: 14
