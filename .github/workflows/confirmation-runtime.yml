name: Abyss confirmation runtime

on:
  push:
    paths:
      - '.github/workflows/confirmation-runtime.yml'
      - 'scripts/test-abyss-confirmation-runtime.sh'
      - 'scripts/test-abyss-confirmation-multi-output-runtime.sh'
      - 'scripts/test-abyss-elastic-fill.py'
      - 'scripts/test-abyss-elastic-fill.sh'
      - 'scripts/test-abyss-polkit-runtime.sh'
      - 'scripts/run-abyss-polkit-runtime-session.sh'
      - 'scripts/test-abyss-confirmation-popup-contract.py'
      - 'scripts/test-confirmation-foundation-contract.py'
      - 'scripts/test-confirmation-anchor-policy.sh'
      - 'scripts/test-polkit-authflow-backend-contract.py'
      - 'scripts/test-abyss-polkit-presenter-contract.py'
      - 'scripts/test-abyss-polkit-integration-contract.py'
      - 'scripts/test-abyss-prompt-fallback-contract.py'
      - 'scripts/test-abyss-critical-prompt-fullscreen-contract.py'
      - 'services/ConfirmationService.qml'
      - 'services/PopupAnchorRegistry.qml'
      - 'services/PopupAnchorPolicy.js'
      - 'services/AbyssPromptHostRegistry.qml'
      - 'modules/abyss/**'
      - 'modules/bar/StyledPopup.qml'
      - 'modules/closeConfirm/**'
      - 'modules/polkit/**'
      - 'modules/waffle/polkit/**'
      - 'GlobalStates.qml'
      - 'defaults/**'
      - 'translations/**'
  pull_request:
    paths:
      - '.github/workflows/confirmation-runtime.yml'
      - 'scripts/test-abyss-confirmation-runtime.sh'
      - 'scripts/test-abyss-confirmation-multi-output-runtime.sh'
      - 'scripts/test-abyss-elastic-fill.py'
      - 'scripts/test-abyss-elastic-fill.sh'
      - 'scripts/test-abyss-polkit-runtime.sh'
      - 'scripts/run-abyss-polkit-runtime-session.sh'
      - 'scripts/test-abyss-confirmation-popup-contract.py'
      - 'scripts/test-confirmation-foundation-contract.py'
      - 'scripts/test-confirmation-anchor-policy.sh'
      - 'scripts/test-polkit-authflow-backend-contract.py'
      - 'scripts/test-abyss-polkit-presenter-contract.py'
      - 'scripts/test-abyss-polkit-integration-contract.py'
      - 'scripts/test-abyss-prompt-fallback-contract.py'
      - 'scripts/test-abyss-critical-prompt-fullscreen-contract.py'
      - 'services/ConfirmationService.qml'
      - 'services/PopupAnchorRegistry.qml'
      - 'services/PopupAnchorPolicy.js'
      - 'services/AbyssPromptHostRegistry.qml'
      - 'modules/abyss/**'
      - 'modules/bar/StyledPopup.qml'
      - 'modules/closeConfirm/**'
      - 'modules/polkit/**'
      - 'modules/waffle/polkit/**'
      - 'GlobalStates.qml'
      - 'defaults/**'
      - 'translations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abyss-confirmation-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run confirmation and Polkit contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-confirmation-foundation-contract.py
          bash scripts/test-confirmation-anchor-policy.sh
          python3 scripts/test-abyss-confirmation-popup-contract.py
          python3 scripts/test-polkit-authflow-backend-contract.py
          python3 scripts/test-abyss-polkit-presenter-contract.py
          python3 scripts/test-abyss-polkit-integration-contract.py
          python3 scripts/test-abyss-prompt-fallback-contract.py
          python3 scripts/test-abyss-critical-prompt-fullscreen-contract.py
          python3 scripts/test-abyss-elastic-fill.py
          bash -n scripts/test-abyss-elastic-fill.sh
          bash -n scripts/test-abyss-polkit-runtime.sh
          bash -n scripts/run-abyss-polkit-runtime-session.sh

  real-polkit:
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Run real Polkit/AuthFlow harness in a logind session
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y policykit-1 systemd-container

          nix shell \
            nixpkgs#quickshell \
            nixpkgs#weston \
            nixpkgs#ripgrep \
            nixpkgs#coreutils \
            --command bash -lc '
              set -euo pipefail
              ci_user=hadalis-polkit-ci
              ci_token=Hadalis-CI-Auth-Only-2026
              work="$(mktemp -d /tmp/hadalis-polkit-ci.XXXXXX)"
              policy=/usr/share/polkit-1/actions/org.hadalis.ci.policy
              status_file="$work/status"
              qs_path="$(command -v qs)"
              weston_path="$(command -v weston)"
              rg_path="$(command -v rg)"
              timeout_path="$(command -v timeout)"
              tool_path="$(dirname "$qs_path"):$(dirname "$weston_path"):$(dirname "$rg_path"):$(dirname "$timeout_path")"
              helper_link=/run/wrappers/bin/polkit-agent-helper-1
              helper_target=""
              for candidate in \
                /usr/lib/polkit-1/polkit-agent-helper-1 \
                /usr/libexec/polkit-agent-helper-1
              do
                if [[ -x "$candidate" ]]; then
                  helper_target="$candidate"
                  break
                fi
              done
              [[ -n "$helper_target" ]] || {
                printf "host polkit-agent-helper-1 was not found\n" >&2
                exit 1
              }

              cleanup() {
                sudo rm -f "$policy"
                sudo rm -f "$helper_link" 2>/dev/null || true
                sudo rmdir /run/wrappers/bin /run/wrappers 2>/dev/null || true
                sudo systemctl restart polkit.service 2>/dev/null || true
                sudo userdel -r "$ci_user" 2>/dev/null || true
                sudo rm -rf -- "$work"
              }
              trap cleanup EXIT

              sudo useradd -m -s /bin/bash "$ci_user"
              printf "%s:%s\n" "$ci_user" "$ci_token" | sudo chpasswd

              printf "%s\n" \
                "<?xml version=\"1.0\" encoding=\"UTF-8\"?>" \
                "<!DOCTYPE policyconfig PUBLIC \"-//freedesktop//DTD PolicyKit Policy Configuration 1.0//EN\" \"http://www.freedesktop.org/standards/PolicyKit/1/policyconfig.dtd\">" \
                "<policyconfig>" \
                "  <vendor>Hadalis CI</vendor>" \
                "  <action id=\"org.hadalis.ci.authenticate\">" \
                "    <description>Authenticate the disposable Hadalis CI identity</description>" \
                "    <message>Authentication required for the Hadalis Polkit runtime test</message>" \
                "    <defaults>" \
                "      <allow_any>auth_self</allow_any>" \
                "      <allow_inactive>auth_self</allow_inactive>" \
                "      <allow_active>auth_self</allow_active>" \
                "    </defaults>" \
                "  </action>" \
                "</policyconfig>" \
                | sudo tee "$policy" >/dev/null

              # nixpkgs' libpolkit-agent is built for the NixOS helper path.
              # On the Ubuntu runner, bridge that CI-only absolute path to the
              # host setuid helper instead of replacing authentication semantics.
              sudo install -d -m 0755 /run/wrappers/bin
              sudo ln -sfn "$helper_target" "$helper_link"

              sudo systemctl restart polkit.service
              sudo systemctl start systemd-machined.service

              cp -a . "$work/repo"
              sudo chown -R "$ci_user:$ci_user" "$work"

              # Create a real PAM/logind session for the disposable user.
              # systemd-run + PAMName=login is the documented service-style
              # session path; unlike machinectl shell on the GitHub host image it
              # gives us an observable process exit status and session unit.
              session_unit=hadalis-polkit-ci-runtime
              set +e
              timeout 90s sudo systemd-run \
                --unit="$session_unit" \
                --collect \
                --wait \
                --pipe \
                --uid="$ci_user" \
                --property=PAMName=login \
                --setenv=XDG_SESSION_TYPE=wayland \
                --setenv="PATH=$PATH" \
                --setenv="HADALIS_POLKIT_CI_TOKEN=$ci_token" \
                --setenv="HADALIS_POLKIT_CI_REPO=$work/repo" \
                --setenv="HADALIS_POLKIT_CI_STATUS_FILE=$status_file" \
                --setenv="HADALIS_POLKIT_CI_WESTON_LOG=$work/weston.log" \
                --setenv="HADALIS_POLKIT_CI_TOOL_PATH=$tool_path" \
                /bin/bash "$work/repo/scripts/run-abyss-polkit-runtime-session.sh"
              session_status=$?
              set -e

              if [[ "$session_status" -ne 0 ]] \
                  || [[ ! -f "$status_file" ]] \
                  || ! grep -Fxq PASS "$status_file"; then
                printf "real-polkit session status=%s\n" "$session_status" >&2
                sudo loginctl list-sessions --no-legend 2>/dev/null || true
                sudo journalctl -u "$session_unit" --no-pager -n 200 2>/dev/null || true
                cat "$work/weston.log" 2>/dev/null || true
                [[ -f "$status_file" ]] && cat "$status_file" >&2 || true
                exit 1
              fi
            '

  headless-wayland:
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Run confirmation harness on headless Wayland
        shell: bash
        run: |
          set -euo pipefail
          nix shell             nixpkgs#quickshell             nixpkgs#weston             nixpkgs#ripgrep             nixpkgs#dbus             nixpkgs#coreutils             --command bash -lc '
              set -euo pipefail
              runtime_dir="$(mktemp -d)"
              export XDG_RUNTIME_DIR="$runtime_dir"
              chmod 700 "$XDG_RUNTIME_DIR"
              export WAYLAND_DISPLAY=wayland-hadalis-confirmation
              export QT_QPA_PLATFORM=wayland
              export QT_QUICK_BACKEND=software
              export QSG_RENDER_LOOP=basic
              export LIBGL_ALWAYS_SOFTWARE=1

              weston                 --backend=headless-backend.so                 --socket="$WAYLAND_DISPLAY"                 --idle-time=0                 --log="$RUNNER_TEMP/weston-confirmation.log" &
              weston_pid=$!

              cleanup() {
                kill "$weston_pid" 2>/dev/null || true
                wait "$weston_pid" 2>/dev/null || true
                rm -rf -- "$runtime_dir"
              }
              trap cleanup EXIT

              for _ in $(seq 1 100); do
                if [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
                  break
                fi
                if ! kill -0 "$weston_pid" 2>/dev/null; then
                  cat "$RUNNER_TEMP/weston-confirmation.log" || true
                  exit 1
                fi
                sleep 0.1
              done

              if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
                cat "$RUNNER_TEMP/weston-confirmation.log" || true
                echo "Weston headless socket did not become ready" >&2
                exit 1
              fi

              bash scripts/test-abyss-confirmation-runtime.sh
              bash scripts/test-abyss-elastic-fill.sh
            '

      - name: Show Weston log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/weston-confirmation.log" 2>/dev/null || true

  multi-output-wayland:
    needs: headless-wayland
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Run confirmation harness on two Wayland outputs
        shell: bash
        run: |
          set -euo pipefail
          nix shell \
            nixpkgs#quickshell \
            nixpkgs#weston \
            nixpkgs#ripgrep \
            nixpkgs#coreutils \
            --command bash -lc '
              set -euo pipefail
              runtime_dir="$(mktemp -d)"
              export XDG_RUNTIME_DIR="$runtime_dir"
              chmod 700 "$XDG_RUNTIME_DIR"

              parent_display=wayland-hadalis-confirmation-parent
              child_display=wayland-hadalis-confirmation-multi
              parent_pid=""
              child_pid=""

              cleanup() {
                if [[ -n "$child_pid" ]]; then
                  kill "$child_pid" 2>/dev/null || true
                  wait "$child_pid" 2>/dev/null || true
                fi
                if [[ -n "$parent_pid" ]]; then
                  kill "$parent_pid" 2>/dev/null || true
                  wait "$parent_pid" 2>/dev/null || true
                fi
                rm -rf -- "$runtime_dir"
              }
              trap cleanup EXIT

              # Use a headless parent and the Weston Wayland backend for the
              # multi-output compositor. The Wayland backend explicitly models
              # --output-count as distinct outputs and avoids X11/XRandR
              # discovery differences in Qt/Quickshell.
              weston \
                --backend=headless-backend.so \
                --socket="$parent_display" \
                --idle-time=0 \
                --log="$RUNNER_TEMP/weston-confirmation-parent.log" &
              parent_pid=$!

              for _ in $(seq 1 120); do
                [[ -S "$XDG_RUNTIME_DIR/$parent_display" ]] && break
                kill -0 "$parent_pid" 2>/dev/null || {
                  cat "$RUNNER_TEMP/weston-confirmation-parent.log" || true
                  exit 1
                }
                sleep 0.1
              done
              [[ -S "$XDG_RUNTIME_DIR/$parent_display" ]] || {
                cat "$RUNNER_TEMP/weston-confirmation-parent.log" || true
                exit 1
              }

              WAYLAND_DISPLAY="$parent_display" weston \
                --backend=wayland-backend.so \
                --display="$parent_display" \
                --renderer=pixman \
                --socket="$child_display" \
                --output-count=2 \
                --width=720 \
                --height=520 \
                --idle-time=0 \
                --log="$RUNNER_TEMP/weston-confirmation-multi.log" &
              child_pid=$!

              for _ in $(seq 1 120); do
                [[ -S "$XDG_RUNTIME_DIR/$child_display" ]] && break
                kill -0 "$child_pid" 2>/dev/null || {
                  cat "$RUNNER_TEMP/weston-confirmation-multi.log" || true
                  exit 1
                }
                sleep 0.1
              done
              [[ -S "$XDG_RUNTIME_DIR/$child_display" ]] || {
                cat "$RUNNER_TEMP/weston-confirmation-multi.log" || true
                exit 1
              }

              export WAYLAND_DISPLAY="$child_display"
              export QT_QPA_PLATFORM=wayland
              export QT_QUICK_BACKEND=software
              export QSG_RENDER_LOOP=basic
              export LIBGL_ALWAYS_SOFTWARE=1

              bash scripts/test-abyss-confirmation-multi-output-runtime.sh
            '

      - name: Show multi-output logs on failure
        if: failure()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/weston-confirmation-parent.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/weston-confirmation-multi.log" 2>/dev/null || true

  nested-niri:
    needs: multi-output-wayland
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Run confirmation harness inside nested Niri
        shell: bash
        run: |
          set -euo pipefail
          nix shell \
            nixpkgs#quickshell \
            nixpkgs#niri \
            nixpkgs#xorg.xorgserver \
            nixpkgs#xorg.libX11 \
            nixpkgs#xorg.libXcursor \
            nixpkgs#xorg.libXfixes \
            nixpkgs#xorg.libXi \
            nixpkgs#xorg.libXrandr \
            nixpkgs#xorg.libXrender \
            nixpkgs#libxkbcommon \
            nixpkgs#mesa \
            nixpkgs#mesa-demos \
            nixpkgs#libglvnd \
            nixpkgs#ripgrep \
            nixpkgs#coreutils \
            --command bash -lc '
              set -euo pipefail
              runtime_dir="$(mktemp -d)"
              niri_config="$(mktemp)"
              export XDG_RUNTIME_DIR="$runtime_dir"
              chmod 700 "$XDG_RUNTIME_DIR"
              export DISPLAY=:99
              export WINIT_UNIX_BACKEND=x11
              # winit dlopens its optional X11 backend libraries by SONAME.
              # Nix does not expose those dlopen-only libraries through the
              # executable RPATH, so make the exact store lib dirs visible.
              x11_lib_path=""
              for attr in \
                xorg.libX11 \
                xorg.libXcursor \
                xorg.libXfixes \
                xorg.libXi \
                xorg.libXrandr \
                xorg.libXrender \
                libxkbcommon
              do
                store_path="$(nix eval --raw "nixpkgs#${attr}.outPath")"
                x11_lib_path="${x11_lib_path:+$x11_lib_path:}$store_path/lib"
              done
              mesa_path="$(nix eval --raw nixpkgs#mesa.outPath)"
              glvnd_path="$(nix eval --raw nixpkgs#libglvnd.outPath)"
              export LD_LIBRARY_PATH="$mesa_path/lib:$glvnd_path/lib:$x11_lib_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
              export LIBGL_ALWAYS_SOFTWARE=1
              export LIBGL_DRIVERS_PATH="$mesa_path/lib/dri"
              export __EGL_VENDOR_LIBRARY_DIRS="$mesa_path/share/glvnd/egl_vendor.d"
              export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
              export GALLIUM_DRIVER=llvmpipe
              export EGL_PLATFORM=x11
              export EGL_LOG_LEVEL=debug
              export LIBGL_DEBUG=verbose
              export QT_QPA_PLATFORM=wayland
              export QT_QUICK_BACKEND=software
              export QSG_RENDER_LOOP=basic
              unset WAYLAND_DISPLAY || true

              Xvfb "$DISPLAY" \
                -screen 0 1280x720x24 \
                -nolisten tcp \
                >"$RUNNER_TEMP/xvfb-niri-confirmation.log" 2>&1 &
              xvfb_pid=$!
              niri_pid=""

              cleanup() {
                if [[ -n "$niri_pid" ]]; then
                  kill "$niri_pid" 2>/dev/null || true
                  wait "$niri_pid" 2>/dev/null || true
                fi
                kill "$xvfb_pid" 2>/dev/null || true
                wait "$xvfb_pid" 2>/dev/null || true
                rm -rf -- "$runtime_dir" "$niri_config"
              }
              trap cleanup EXIT

              for _ in $(seq 1 100); do
                [[ -S /tmp/.X11-unix/X99 ]] && break
                kill -0 "$xvfb_pid" 2>/dev/null || {
                  cat "$RUNNER_TEMP/xvfb-niri-confirmation.log" || true
                  exit 1
                }
                sleep 0.1
              done
              [[ -S /tmp/.X11-unix/X99 ]] || {
                cat "$RUNNER_TEMP/xvfb-niri-confirmation.log" || true
                exit 1
              }

              # Keep this diagnostic non-fatal: Niri below is the acceptance
              # boundary, while eglinfo makes the CI graphics environment
              # actionable if Smithay cannot create its GLES renderer.
              eglinfo --display x11                 >"$RUNNER_TEMP/eglinfo-niri-confirmation.log" 2>&1 || true

              : > "$niri_config"
              niri --config "$niri_config" \
                >"$RUNNER_TEMP/niri-confirmation.log" 2>&1 &
              niri_pid=$!

              nested_display=""
              for _ in $(seq 1 150); do
                nested_display="$(
                  find "$XDG_RUNTIME_DIR" -maxdepth 1 -type s \
                    -name "wayland-*" -printf "%f\\n" | head -n1
                )"
                [[ -n "$nested_display" ]] && break
                if ! kill -0 "$niri_pid" 2>/dev/null; then
                  cat "$RUNNER_TEMP/niri-confirmation.log" || true
                  exit 1
                fi
                sleep 0.1
              done
              if [[ -z "$nested_display" ]]; then
                cat "$RUNNER_TEMP/niri-confirmation.log" || true
                echo "Nested Niri Wayland socket did not become ready" >&2
                exit 1
              fi

              export WAYLAND_DISPLAY="$nested_display"
              niri_socket="$(
                find "$XDG_RUNTIME_DIR" -maxdepth 1 -type s \
                  -name "niri.${nested_display}.*.sock" -print | head -n1
              )"
              if [[ -n "$niri_socket" ]]; then
                export NIRI_SOCKET="$niri_socket"
              fi

              bash scripts/test-abyss-confirmation-runtime.sh
              bash scripts/test-abyss-elastic-fill.sh
            '

      - name: Show nested Niri logs on failure
        if: failure()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/xvfb-niri-confirmation.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/eglinfo-niri-confirmation.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/niri-confirmation.log" 2>/dev/null || true
