name: Hadalird offline contracts

on:
  push:
    paths:
      - 'scripts/hadalird-*.py'
      - 'scripts/test-hadalird-*.py'
      - 'assets/helpers/inir-hadalird-system-provision'
      - 'assets/polkit/org.inir.hadalird-system-provision.policy'
      - 'modules/settings/IntegrationsConfig.qml'
      - 'services/Hadalird.qml'
      - 'scripts/test-hadalird-polkit-visibility.py'
      - 'modules/settings/SettingsFocus.qml'
      - 'modules/settings/SettingsOverlayNativeHost.qml'
      - 'distro/arch/inir-shell/PKGBUILD'
      - 'distro/arch/inir-shell-git/PKGBUILD'
      - '.github/workflows/hadalird-offline.yml'
  pull_request:
    paths:
      - 'scripts/hadalird-*.py'
      - 'scripts/test-hadalird-*.py'
      - 'assets/helpers/inir-hadalird-system-provision'
      - 'assets/polkit/org.inir.hadalird-system-provision.policy'
      - 'modules/settings/IntegrationsConfig.qml'
      - 'services/Hadalird.qml'
      - 'distro/arch/inir-shell/PKGBUILD'
      - 'distro/arch/inir-shell-git/PKGBUILD'
      - '.github/workflows/hadalird-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hadalird-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Hadalird user-package lifecycle
        run: python3 scripts/test-hadalird-manager.py
      - name: Validate Hadalird Settings Flow layout
        run: python3 scripts/test-hadalird-settings-flow.py
      - name: Validate Polkit elevation and one-click helper installer
        run: python3 scripts/test-hadalird-polkit-visibility.py
      - name: Validate Obsidian host wrapper width
        run: python3 scripts/test-hadalird-obsidian-wrapper.py
      - name: Validate root provisioning without root
        run: python3 scripts/test-hadalird-system-provision.py
      - name: Validate repo-copy Arch gateway package bootstrap
        run: python3 scripts/test-hadalird-gateway-bootstrap.py
      - name: Check existing host removal safety
        run: python3 scripts/test-hadalird-install-lifecycle.py
      - name: Verify packaging syntax
        run: |
          bash -n distro/arch/inir-shell/PKGBUILD
          bash -n distro/arch/inir-shell-git/PKGBUILD
