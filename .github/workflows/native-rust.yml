name: Native Rust staging

on:
  push:
    paths:
      - 'native/**'
      - 'scripts/native-dispatch'
      - 'scripts/native-cutover-benchmark.sh'
      - 'scripts/test-native-selector-contract.sh'
      - 'scripts/test-native-selector-behavior.sh'
      - 'scripts/inir'
      - 'services/KeyboardIndicators.qml'
      - 'services/RuntimeDiagnostics.qml'
      - 'services/NiriService.qml'
      - 'services/LocalMusic.qml'
      - 'services/IconThemeService.qml'
      - 'services/Wallpapers.qml'
      - 'services/deferred/Cliphist.qml'
      - 'services/deferred/NiriKeybinds.qml'
      - 'modules/onScreenKeyboard/PhysicalKeyboardFeedback.qml'
      - 'modules/settings/NiriConfig.qml'
      - 'modules/settings/MonitorVisibilityConfig.qml'
      - 'scripts/colors/switchwall.sh'
      - 'defaults/niri/config.d/50-startup.kdl'
      - 'sdata/migrations/049-native-clipboard-selector.sh'
      - '.github/workflows/native-rust.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/native-dispatch'
      - 'scripts/test-native-selector-behavior.sh'
      - '.github/workflows/native-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Assert reversible native cutover boundary
        run: |
          python3 native/scripts/assert-dormant.py
          bash -n scripts/native-dispatch
          bash -n scripts/native-cutover-benchmark.sh
          bash -n sdata/migrations/049-native-clipboard-selector.sh
          bash scripts/test-native-selector-contract.sh
          bash scripts/test-native-selector-behavior.sh

      # During the dormant staging phase, format the runner copy before compile
      # checks so incremental port commits are not blocked by rustfmt-only diffs.
      # The final pre-cutover pass switches this back to --check after committing
      # the canonical formatted tree.
      - name: Format staging copy
        run: cargo fmt --manifest-path native/Cargo.toml --all

      - name: Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path native/Cargo.toml --workspace --all-targets
