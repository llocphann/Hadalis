name: Native Rust staging

on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-rust.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Assert native code is still dormant
        run: python3 native/scripts/assert-dormant.py

      - name: Format check
        run: cargo fmt --manifest-path native/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path native/Cargo.toml --workspace --all-targets
