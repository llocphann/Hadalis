name: Nix package

on:
  push:
    paths:
      - '.github/workflows/nix.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'VERSION'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'setup'
      - 'scripts/inir'
      - 'scripts/lib/**'
      - 'scripts/colors/generate_colors_material.py'
      - 'scripts/colors/switchwall.sh'
      - 'sdata/lib/runtime-payload.py'
      - 'sdata/lib/versioning.sh'
      - 'sdata/runtime-*.txt'
      - 'sdata/runtime-exclusions.json'
      - 'assets/applications/**'
      - 'assets/icons/**'
  pull_request:
    paths:
      - '.github/workflows/nix.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'VERSION'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'setup'
      - 'scripts/inir'
      - 'scripts/lib/**'
      - 'scripts/colors/generate_colors_material.py'
      - 'scripts/colors/switchwall.sh'
      - 'sdata/lib/runtime-payload.py'
      - 'sdata/lib/versioning.sh'
      - 'sdata/runtime-*.txt'
      - 'sdata/runtime-exclusions.json'
      - 'assets/applications/**'
      - 'assets/icons/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Evaluate flake outputs
        run: nix flake check --no-build --print-build-logs

      - name: Build Hadalis package
        run: nix build .#inir --print-build-logs
