name: Nix package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Evaluate flake outputs
        run: nix flake check --no-build --print-build-logs

      - name: Build Hadalis package
        run: nix build .#inir --print-build-logs
