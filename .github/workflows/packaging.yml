name: Packaging contracts

on:
  push:
    paths:
      - 'VERSION'
      - 'Makefile'
      - 'setup'
      - 'scripts/inir'
      - 'scripts/release.sh'
      - 'scripts/colors/generate_colors_material.py'
      - 'scripts/colors/switchwall.sh'
      - 'scripts/colors/modules/31-zed.sh'
      - 'scripts/test-packaging-contract.sh'
      - 'scripts/test-make-install-lifecycle.sh'
      - 'scripts/test-doctor-dependency-routing.sh'
      - 'scripts/test-nix-module-contract.sh'
      - 'scripts/test-optional-audio-deps-contract.sh'
      - 'services/AwwwBackend.qml'
      - 'services/deferred/EasyEffects.qml'
      - 'services/deferred/EqualizerService.qml'
      - 'defaults/config.json'
      - 'distro/arch/**'
      - 'sdata/dist-arch/**'
      - 'sdata/lib/doctor.sh'
      - 'sdata/lib/runtime-payload.py'
      - 'sdata/runtime-root-files.txt'
      - 'sdata/runtime-payload-dirs.txt'
      - 'sdata/runtime-exclusions.json'
      - 'nix/**'
      - 'assets/systemd/**'
      - 'assets/applications/**'
      - 'assets/icons/desktop-symbolic.svg'
      - 'assets/helpers/inir-*'
      - 'assets/polkit/**'
      - 'assets/tlp/**'
      - 'docs/AUDIO_MEDIA.md'
      - 'docs/INSTALL.md'
      - 'docs/PACKAGES.md'
      - 'docs/RELEASING.md'
      - 'docs/THINKFAN.md'
      - 'docs/UNINSTALL.md'
      - '.github/workflows/nix.yml'
      - '.github/workflows/packaging.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'Makefile'
      - 'setup'
      - 'scripts/inir'
      - 'scripts/release.sh'
      - 'scripts/colors/generate_colors_material.py'
      - 'scripts/colors/switchwall.sh'
      - 'scripts/colors/modules/31-zed.sh'
      - 'scripts/test-packaging-contract.sh'
      - 'scripts/test-make-install-lifecycle.sh'
      - 'scripts/test-doctor-dependency-routing.sh'
      - 'scripts/test-nix-module-contract.sh'
      - 'scripts/test-optional-audio-deps-contract.sh'
      - 'services/AwwwBackend.qml'
      - 'services/deferred/EasyEffects.qml'
      - 'services/deferred/EqualizerService.qml'
      - 'defaults/config.json'
      - 'distro/arch/**'
      - 'sdata/dist-arch/**'
      - 'sdata/lib/doctor.sh'
      - 'sdata/lib/runtime-payload.py'
      - 'sdata/runtime-root-files.txt'
      - 'sdata/runtime-payload-dirs.txt'
      - 'sdata/runtime-exclusions.json'
      - 'nix/**'
      - 'assets/systemd/**'
      - 'assets/applications/**'
      - 'assets/icons/desktop-symbolic.svg'
      - 'assets/helpers/inir-*'
      - 'assets/polkit/**'
      - 'assets/tlp/**'
      - 'docs/AUDIO_MEDIA.md'
      - 'docs/INSTALL.md'
      - 'docs/PACKAGES.md'
      - 'docs/RELEASING.md'
      - 'docs/THINKFAN.md'
      - 'docs/UNINSTALL.md'
      - '.github/workflows/nix.yml'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate packaging contracts
        run: bash scripts/test-packaging-contract.sh

      - name: Validate Nix module contracts
        run: |
          bash -n scripts/test-nix-module-contract.sh
          bash scripts/test-nix-module-contract.sh

      - name: Validate doctor dependency routing
        run: |
          bash -n scripts/test-doctor-dependency-routing.sh
          bash scripts/test-doctor-dependency-routing.sh

      - name: Validate optional audio dependency contracts
        run: |
          bash -n scripts/test-optional-audio-deps-contract.sh
          bash scripts/test-optional-audio-deps-contract.sh

      - name: Validate Makefile install lifecycle
        run: |
          bash -n scripts/test-make-install-lifecycle.sh
          bash scripts/test-make-install-lifecycle.sh

      - name: Parse Arch recipes and lifecycle hooks
        run: |
          bash -n distro/arch/inir-shell/PKGBUILD
          bash -n distro/arch/inir-shell-git/PKGBUILD
          bash -n distro/arch/inir-meta/PKGBUILD
          for recipe in sdata/dist-arch/inir-*/PKGBUILD; do
            bash -n "$recipe"
          done
          repo_version="$(tr -d '[:space:]' < VERSION)"
          deps_version="$(grep -m1 '^pkgver=' sdata/dist-arch/inir-deps/PKGBUILD | cut -d= -f2-)"
          if [[ "$deps_version" != "$repo_version" ]]; then
            echo "::error::inir-deps pkgver=$deps_version does not match VERSION=$repo_version"
            exit 1
          fi
          bash -n distro/arch/inir-shell/inir-shell.install
          bash -n distro/arch/inir-shell-git/inir-shell-git.install
