name: Packaging contracts

on:
  push:
    paths:
      - 'VERSION'
      - 'Makefile'
      - 'setup'
      - 'scripts/inir'
      - 'scripts/test-packaging-contract.sh'
      - 'scripts/test-make-install-lifecycle.sh'
      - 'distro/arch/**'
      - 'sdata/dist-arch/**'
      - 'sdata/lib/runtime-payload.py'
      - 'sdata/runtime-root-files.txt'
      - 'sdata/runtime-payload-dirs.txt'
      - 'nix/**'
      - 'assets/systemd/**'
      - 'assets/applications/**'
      - 'assets/icons/desktop-symbolic.svg'
      - 'assets/helpers/inir-*'
      - 'assets/polkit/**'
      - 'assets/tlp/**'
      - 'docs/INSTALL.md'
      - 'docs/PACKAGES.md'
      - 'docs/RELEASING.md'
      - 'docs/THINKFAN.md'
      - 'docs/UNINSTALL.md'
      - '.github/workflows/packaging.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'Makefile'
      - 'setup'
      - 'scripts/inir'
      - 'scripts/test-packaging-contract.sh'
      - 'scripts/test-make-install-lifecycle.sh'
      - 'distro/arch/**'
      - 'sdata/dist-arch/**'
      - 'sdata/lib/runtime-payload.py'
      - 'sdata/runtime-root-files.txt'
      - 'sdata/runtime-payload-dirs.txt'
      - 'nix/**'
      - 'assets/systemd/**'
      - 'assets/applications/**'
      - 'assets/icons/desktop-symbolic.svg'
      - 'assets/helpers/inir-*'
      - 'assets/polkit/**'
      - 'assets/tlp/**'
      - 'docs/INSTALL.md'
      - 'docs/PACKAGES.md'
      - 'docs/RELEASING.md'
      - 'docs/THINKFAN.md'
      - 'docs/UNINSTALL.md'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate packaging contracts
        run: bash scripts/test-packaging-contract.sh

      - name: Validate Makefile install lifecycle
        run: |
          bash -n scripts/test-make-install-lifecycle.sh
          bash scripts/test-make-install-lifecycle.sh

      - name: Parse Arch recipes and lifecycle hooks
        run: |
          bash -n distro/arch/inir-shell/PKGBUILD
          bash -n distro/arch/inir-shell-git/PKGBUILD
          bash -n distro/arch/inir-meta/PKGBUILD
          bash -n distro/arch/inir-shell/inir-shell.install
          bash -n distro/arch/inir-shell-git/inir-shell-git.install
