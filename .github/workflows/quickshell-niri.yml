name: Niri Quickshell overlay

on:
  push:
    paths:
      - 'distro/arch/inir-quickshell-niri/**'
      - '.github/workflows/quickshell-niri.yml'
  pull_request:
    paths:
      - 'distro/arch/inir-quickshell-niri/**'
      - '.github/workflows/quickshell-niri.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickshell-niri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git glib2 jemalloc libdrm libpipewire libxcb mesa pam polkit \
            qt6-base qt6-declarative qt6-svg qt6-wayland wayland \
            cli11 cmake ninja pkgconf qt6-shadertools spirv-tools \
            vulkan-headers wayland-protocols

      - name: Build patched Quickshell package
        run: |
          chown -R nobody:nobody "$GITHUB_WORKSPACE"
          runuser -u nobody -- bash -lc \
            'cd "$GITHUB_WORKSPACE/distro/arch/inir-quickshell-niri" && makepkg --nodeps --noconfirm --cleanbuild'
