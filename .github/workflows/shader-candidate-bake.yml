name: Shader Candidate Bake

on:
  push:
    paths:
      - ".github/workflows/shader-candidate-bake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-latest
    container: debian:sid
    steps:
      - name: Install shader baker
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates python3 qt6-shader-baker

      - name: Checkout exact commit
        uses: actions/checkout@v5

      - name: Verify Wull shader baker reproducibility
        run: |
          QSB="$(command -v qsb || true)"
          if [ -z "$QSB" ]; then QSB=/usr/lib/qt6/bin/qsb; fi
          "$QSB" --version
          "$QSB" --qt6 -o /tmp/WaterDropletMaterial.baseline.qsb modules/abyss/companion/WaterDropletMaterial.frag
          cmp /tmp/WaterDropletMaterial.baseline.qsb modules/abyss/companion/WaterDropletMaterial.frag.qsb

      - name: Generate strict-lossless Wull material candidate
        run: |
          mkdir -p _shader_artifact
          python3 scripts/build-wull-material-candidate.py _shader_artifact/WaterDropletMaterial.frag

      - name: Bake candidate shader pack
        run: |
          QSB="$(command -v qsb || true)"
          if [ -z "$QSB" ]; then QSB=/usr/lib/qt6/bin/qsb; fi
          "$QSB" --qt6 -o _shader_artifact/WaterDropletMaterial.frag.qsb _shader_artifact/WaterDropletMaterial.frag
          "$QSB" --dump _shader_artifact/WaterDropletMaterial.frag.qsb >/dev/null
          sha256sum _shader_artifact/* > _shader_artifact/SHA256SUMS

      - name: Upload shader candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: wull-material-candidate
          path: _shader_artifact/
          if-no-files-found: error
          retention-days: 1
