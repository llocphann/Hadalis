name: Shader Candidate Bake

on:
  push:
    paths:
      - ".github/workflows/shader-candidate-bake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-latest
    container: debian:sid
    steps:
      - name: Install shader baker
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates python3 qt6-shader-baker

      - name: Checkout exact commit
        uses: actions/checkout@v5

      - name: Verify Wull shader baker reproducibility
        run: |
          QSB="$(command -v qsb || true)"
          if [ -z "$QSB" ]; then QSB=/usr/lib/qt6/bin/qsb; fi
          "$QSB" --version
          "$QSB" --qt6 -o /tmp/WaterDropletMaterial.baseline.qsb modules/abyss/companion/WaterDropletMaterial.frag
          cmp /tmp/WaterDropletMaterial.baseline.qsb modules/abyss/companion/WaterDropletMaterial.frag.qsb

      - name: Generate strict-lossless Wull material candidate
        run: |
          mkdir -p _shader_artifact
          python3 - <<'PY'
          from pathlib import Path

          src = Path("modules/abyss/companion/WaterDropletMaterial.frag")
          text = src.read_text()
          old = """            float along=dot(bubble-surface,internal);
            float offset=length(surface+internal*along-bubble);
            float radius=0.007+hash(vec2(index,4.0))*0.018;
            float edge=exp(-abs(offset-radius)*170.0)*step(0.0,along)*step(along,travel);
            float attenuation=exp(-along*0.70);
            color+=mix(waterLight,white,0.25)*edge*0.30*attenuation;
            float glint=exp(-offset*offset/(radius*radius*0.08))
                *step(0.0,along)*step(along,travel);
            color+=mix(waterLight,white,0.20)*glint*0.50*attenuation;
"""
          new = """            float along=dot(bubble-surface,internal);
            // Both old bubble contributions are multiplied by
            // step(0,along)*step(along,travel). Outside that closed segment
            // they are exactly zero, so skip the expensive distance/hash/exp
            // path without changing either boundary case.
            if(along<0.0 || along>travel) continue;
            float offset=length(surface+internal*along-bubble);
            float radius=0.007+hash(vec2(index,4.0))*0.018;
            float edge=exp(-abs(offset-radius)*170.0);
            float attenuation=exp(-along*0.70);
            color+=mix(waterLight,white,0.25)*edge*0.30*attenuation;
            float glint=exp(-offset*offset/(radius*radius*0.08));
            color+=mix(waterLight,white,0.20)*glint*0.50*attenuation;
"""
          if text.count(old) != 1:
              raise SystemExit("unexpected WaterDropletMaterial bubble block")
          candidate = text.replace(old, new)
          (Path("_shader_artifact") / "WaterDropletMaterial.frag").write_text(candidate)
          PY

      - name: Bake candidate shader pack
        run: |
          QSB="$(command -v qsb || true)"
          if [ -z "$QSB" ]; then QSB=/usr/lib/qt6/bin/qsb; fi
          "$QSB" --qt6 -o _shader_artifact/WaterDropletMaterial.frag.qsb _shader_artifact/WaterDropletMaterial.frag
          "$QSB" --dump _shader_artifact/WaterDropletMaterial.frag.qsb >/dev/null
          sha256sum _shader_artifact/* > _shader_artifact/SHA256SUMS

      - name: Upload shader candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: wull-material-candidate
          path: _shader_artifact/
          if-no-files-found: error
          retention-days: 1
