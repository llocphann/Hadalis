name: Unified Surface U1 Shader

on:
  push:
    branches: [dev]
    paths:
      - "scripts/unified-surface/**"
      - "scripts/test-unified-surface-u1-contract.py"
      - "sdata/runtime-exclusions.json"
      - ".github/workflows/unified-surface-u1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt shader baker
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-shader-baker

      - name: Verify canonical U1 shader semantics
        run: scripts/unified-surface/verify-shader-package.sh

      - name: Verify isolated U1 contract
        run: python3 scripts/test-unified-surface-u1-contract.py

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Smoke U1 on owned headless compositor
        env:
          WORK_DIR: ${{ runner.temp }}/hadalis-u1-smoke
        run: |
          rm -rf "$WORK_DIR"
          nix develop .#workflow-acceptance --command bash -lc '
            set -euo pipefail
            python3 scripts/unified-surface/smoke-headless-sway.py \
              --work-dir "$WORK_DIR" \
              --sway "$(command -v sway)" \
              --quickshell "$(command -v quickshell)" \
              --grim "$(command -v grim)"
          '

      - name: Upload U1 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hadalis-u1-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hadalis-u1-smoke/report.json
            ${{ runner.temp }}/hadalis-u1-smoke/*.log
            ${{ runner.temp }}/hadalis-u1-smoke/*.ppm
          if-no-files-found: warn
          retention-days: 7

      - name: Upload freshly baked U1 QSB
        uses: actions/upload-artifact@v4
        with:
          name: hadalis-u1-qsb
          path: scripts/unified-surface/U1Surface.qsb
          if-no-files-found: error
          retention-days: 7
