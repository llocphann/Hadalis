name: Unified Surface U1 Shader

on:
  push:
    branches: [dev]
    paths:
      - "scripts/unified-surface/**"
      - "scripts/test-unified-surface-u1-contract.py"
      - "sdata/runtime-exclusions.json"
      - ".github/workflows/unified-surface-u1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt shader baker
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-shader-baker

      - name: Bake U1 shader
        run: scripts/unified-surface/build-shader.sh

      - name: Verify isolated U1 contract
        env:
          HADALIS_REQUIRE_U1_QSB: "1"
        run: python3 scripts/test-unified-surface-u1-contract.py

      - name: Persist canonical U1 QSB
        run: |
          if [[ -z "$(git status --porcelain -- scripts/unified-surface/U1Surface.qsb)" ]]; then
            echo "U1Surface.qsb already matches the canonical bake"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/unified-surface/U1Surface.qsb
          git commit -m "build(surface): update U1 shader artifact"
          git push origin HEAD:dev

      - name: Upload canonical U1 QSB
        uses: actions/upload-artifact@v4
        with:
          name: hadalis-u1-qsb
          path: scripts/unified-surface/U1Surface.qsb
          if-no-files-found: error
          retention-days: 7
