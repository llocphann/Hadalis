[workspace]
resolver = "2"
members = [
    "crates/inir-protocol",
    "inir-native",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
html-escape = "0.2"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
